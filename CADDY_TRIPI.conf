# Add these site blocks to the existing infra Caddyfile on the server.

{$TRIPI_DOMAIN} {
  encode zstd gzip

  handle_path /uploads/* {
    root * /srv/uploads/public
    file_server
  }

  handle /api/* {
    reverse_proxy tripi-backend:6000
  }

  handle /docs* {
    reverse_proxy tripi-backend:6000
  }

  handle {
    reverse_proxy tripi-dashboard:6500
  }
}

{$TRIPI_DASHBOARD_DOMAIN} {
  encode zstd gzip
  reverse_proxy tripi-dashboard:6500
}
