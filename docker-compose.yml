name: tripi

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripi-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 6000
      APP_NAME: Tripi
      API_PREFIX: api/v1
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      DASHBOARD_URL: https://${TRIPI_DASHBOARD_DOMAIN}
      CORS_ORIGINS: https://${TRIPI_DOMAIN},https://${TRIPI_DASHBOARD_DOMAIN}
      MOBILE_DEEP_LINK_SCHEME: tripi
      DEFAULT_LOCALE: EN
      DEFAULT_CURRENCY: DZD
      DEFAULT_TIMEZONE: Africa/Algiers
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/uploads
      LOCAL_STORAGE_PUBLIC_URL: https://${TRIPI_DOMAIN}/uploads
      MAIL_TRANSPORT: disabled
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "6000"
    networks:
      - db-network
      - proxy-network
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:6000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: Tripi
        NEXT_PUBLIC_API_URL: https://${TRIPI_DOMAIN}/api/v1
        NEXT_PUBLIC_DEFAULT_LOCALE: en
    container_name: tripi-dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 6500
      HOSTNAME: 0.0.0.0
    expose:
      - "6500"
    networks:
      - proxy-network

volumes:
  uploads_data:
    external: true
    name: infra_uploads_data

networks:
  proxy-network:
    external: true
  db-network:
    external: true
