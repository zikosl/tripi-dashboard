name: infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: global-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tripi}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tripi} -d ${POSTGRES_DB:-tripi}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: global-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tripi.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - db-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_NAME: Tripi
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tripi}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      DASHBOARD_URL: https://${TRIPI_DASHBOARD_DOMAIN}
      CORS_ORIGINS: https://${TRIPI_DOMAIN},https://${TRIPI_DASHBOARD_DOMAIN}
      MOBILE_DEEP_LINK_SCHEME: tripi
      DEFAULT_LOCALE: EN
      DEFAULT_CURRENCY: DZD
      DEFAULT_TIMEZONE: Africa/Algiers
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/uploads
      LOCAL_STORAGE_PUBLIC_URL: https://${TRIPI_DOMAIN}/uploads
      MAIL_TRANSPORT: disabled
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "4000"
    networks:
      - db-network
      - proxy-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: Tripi
        NEXT_PUBLIC_API_URL: https://${TRIPI_DOMAIN}/api/v1
        NEXT_PUBLIC_DEFAULT_LOCALE: en
    container_name: tripi-dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - proxy-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_APP_NAME: Tripi
        EXPO_PUBLIC_API_URL: https://${TRIPI_DOMAIN}/api/v1
        EXPO_PUBLIC_APP_SCHEME: tripi
        EXPO_PUBLIC_DEFAULT_LOCALE: en
    container_name: tripi-client
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - proxy-network

  caddy:
    image: caddy:2-alpine
    container_name: global-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_started
      client:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/srv/uploads:ro
    environment:
      TRIPI_DOMAIN: ${TRIPI_DOMAIN}
      TRIPI_DASHBOARD_DOMAIN: ${TRIPI_DASHBOARD_DOMAIN}
    networks:
      - proxy-network

volumes:
  postgres_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
  uploads_data:

networks:
  proxy-network:
    external: true
  db-network:
    external: true
