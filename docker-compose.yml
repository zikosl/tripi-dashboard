services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: tripi, POSTGRES_PASSWORD: tripi, POSTGRES_DB: tripi }
    ports: ["5432:5432"]
    volumes: [tripi_postgres:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tripi -d tripi"], interval: 5s, timeout: 3s, retries: 10 }
volumes: { tripi_postgres: {} }
